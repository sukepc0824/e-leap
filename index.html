<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./reset.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="./data.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap');

        * {
            font-family: 'Mulish';
        }

        main {
            display: flex;
            flex-direction: column;
            padding: 10px 20px;
            padding-top: 60px;
        }

        p.index {
            color: rgb(62, 82, 155);
            font-size: 14px;
        }

        section .box {
            top: 2px;
            left: 4px;
            gap: 4px;
            position: absolute;
            display: flex;
            align-items: baseline;
            line-height: 1 !important;
        }

        section {
            display: flex;
            position: relative;
            border-top: 1px solid #b4bee0;
            border-bottom: 1px solid #b4bee0;
        }

        section .word {
            display: flex;
            align-items: center;
            width: 153px;
            flex-shrink: 0;
            padding-right: 10px;
            min-height: 84px;
            padding-left: 10px;
            background-color: rgb(196, 221, 247);
        }

        h1 {
            font-size: 22px;
            margin-top: 12px;
            user-select: none;
            font-weight: 700;
        }

        .detail {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            cursor: pointer;
            flex-grow: 1;
        }

        .mean {
            padding-left: 14px;
            font-size: 17px;
            margin-top: 3px;
        }

        .explanation {
            font-size: 13px;
            color: #445;
            line-height: 1.4;
            background: #f0f4f8;
            padding: 8px 12px;
            border-radius: 6px;
        }

        header {
            box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
            position: fixed;
            display: flex;
            background: #f6f6f6;
            height: 40px;
            left: 50%;
            top: 10px;
            padding: 6px 20px;
            border-radius: 100px;
            border: 1px solid #ddd;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            width: fit-content;
        }

        header div {
            diplay: flex;
            gap: 2px;
        }

        span.jp {
            font-size: 0.8em;
        }

        label {
            user-select: none;
        }

        strong,
        .strong {
            color: #cd0000;
            font-weight: 600;
        }

        span.highlight {
            background-color: #777;
            color: white;
            font-weight: 400 !important;
            padding: 2px;
            border-radius: 3px;
            font-size: .8em
        }
    </style>
</head>

<body>
    <header>
        <div>
            <label for="range" style="">表示:</label>
            <select id="range" style="display: none;">
                <option value="all" selected>全て</option>
            </select>
        </div>
        <div>
            <label for="hide-japanese">日本語:</label>
            <input type="checkbox" id="hide-japanese" checked>
        </div>
        <div>
            <label for="hide-english">英語:</label>
            <input type="checkbox" id="hide-english" checked>
        </div>
    </header>
    <main>

    </main>
    <script>
        $(function () {
            // Populate range dropdown options dynamically based on data length
            const totalCount = data.length;
            const $select = $("#range");
            $select.empty();
            $select.append('<option value="all" selected>全て</option>');

            for (let i = 0; i < totalCount; i += 100) {
                const start = i + 1;
                const end = Math.min(i + 100, totalCount);
                $select.append(`<option value="${end}">${start}-${end}</option>`);
            }

            function renderWords() {
                const val = $select.val();
                $("main").empty();

                let items = data;
                if (val !== "all") {
                    const end = Number(val);
                    items = data.slice(end - 100, end);
                }

                items.forEach(element => {
                    const word = element['単語'] || '';
                    let meaning = element['意味'] || element['語の意味'] || '';
                    const no = element['No'] || element['No.'] || '';
                    const explanation = element['解説'] || '';

                    let styledWord = word.replace(/([\u3000-\u303F\u3040-\u309F\u30A0-\u30FF()]+)/g, '<span class="jp">$1</span>');

                    let styledMeaning = meaning.replace(/\[(.+?)\]/g, '<span class="highlight">$1</span>');

                    if (styledMeaning.includes("①") && styledMeaning.includes("②")) {
                        styledMeaning = styledMeaning.replace(/①(.*?)②/, (match, p1) => {
                            const cleaned = p1.replace(/<span class="highlight">.*?<\/span>/g, '');
                            return `①<strong>${cleaned}</strong>②`;
                        });
                    }

                    const $section = `
        <section>
            <div class="box">
                <p class="index">${no}</p>
            </div>
            <div class="word">
                <h1>${styledWord}</h1>
            </div>
            <div class="detail">
                <div class="mean">${styledMeaning}</div>
                ${explanation ? `<div class="explanation">${explanation}</div>` : ''}
            </div>
        </section>`;

                    $($section).appendTo("main");
                });

                if (!$('#hide-japanese').is(':checked')) {
                    $('.mean').hide();
                } else {
                    $('.mean').show();
                }

                if (!$('#hide-english').is(':checked')) {
                    $('.word h1').hide();
                } else {
                    $('.word h1').show();
                }
            }

            $select.on("change", renderWords);

            $('#hide-japanese').on("change", function () {
                if ($(this).is(':checked')) {
                    $('.mean').show();
                } else {
                    $('.mean').hide();
                }
            });

            $('#hide-english').on("change", function () {
                if ($(this).is(':checked')) {
                    $('.word h1').show();
                } else {
                    $('.word h1').hide();
                }
            });

            // Initial render
            renderWords();
        });
    </script>
</body>

</html>
